services:
    adminspace:
        networks:
            edge: {}
            internal: {}
            workadventure-admin:
                aliases:
                    - adminspace
        labels:
            traefik.enable: "true"
            traefik.docker.network: erp_default
            traefik.http.routers.adminspace.rule: "Host(`adminspace.bitwize.org`) && !PathPrefix(`/api`) && !PathPrefix(`/oauth`) && !PathPrefix(`/white-label`) && !PathPrefix(`/hooks`)"
            traefik.http.routers.adminspace.entrypoints: websecure
            traefik.http.routers.adminspace.tls: "true"
            traefik.http.routers.adminspace.tls.certresolver: main-resolver
            traefik.http.services.adminspace.loadbalancer.server.port: "3000"
networks:
    edge:
        external: true
        name: erp_default
